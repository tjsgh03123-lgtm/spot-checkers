<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>카운팅</title>
<meta name="theme-color" content="#0f1318">
<meta name="application-name" content="카운팅">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="카운팅">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
  /* 카운팅 — iron and amber. One memorable thing: the counter ring. Everything else stays quiet. */
  :root { --bg: #0f1318; --bg2: #151b22; --panel: #1b222b; --line: #26303b; --fg: #eef1f5; --muted: #8e98a6; --accent: #ffb020; --accent2: #c97f00; --rest: #3fd2c7; --bad: #ff6b6b; --ok: #6ee7a0;
          --disp: "Bricolage Grotesque", "Noto Sans KR", system-ui, sans-serif; --body: system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--body); }
  body { overflow: hidden; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px); gap: 14px; overflow: auto;
            background: radial-gradient(120% 60% at 50% -10%, #1d2631 0%, var(--bg) 60%); }
  .screen[hidden] { display: none; }
  .screen > * { flex-shrink: 0; }
  h1 { font-family: var(--disp); font-size: 40px; font-weight: 800; letter-spacing: -0.02em; margin: 8px 0 0; line-height: 1; }
  h1 small { font-family: var(--disp); font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: .14em; margin-left: 10px; vertical-align: middle; }
  .hh { display: flex; align-items: center; gap: 12px; }
  .hh h1 { margin: 0; font-size: 30px; }
  .back { width: 44px; height: 44px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); color: var(--fg); font-size: 22px; flex: 0 0 auto; padding: 0; }
  .sub { color: var(--muted); font-size: 15px; margin: 0; line-height: 1.55; max-width: 34em; }
  button { font: inherit; font-weight: 700; font-size: 17px; border: 1px solid var(--line); border-radius: 14px; padding: 15px 18px; background: var(--panel); color: var(--fg); width: 100%; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1200; font-family: var(--disp); font-size: 22px; font-weight: 800; padding: 20px; letter-spacing: -0.01em; box-shadow: 0 10px 30px -10px rgba(255,176,32,.55); }
  button.primary:active { transform: translateY(1px); box-shadow: none; }
  button.danger { background: transparent; border-color: #3a2326; color: var(--bad); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button:disabled { opacity: .5; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }
  /* setup: the exercise name is the headline of the screen */
  .exField { padding: 10px 0 4px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .exField label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .exField input { font-family: var(--disp); font-size: 36px; font-weight: 800; letter-spacing: -0.02em; background: transparent; border: 0; color: var(--fg); width: 100%; padding: 0; outline: none; }
  .exField input::placeholder { color: #3c4753; font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 8px; }
  .chips:empty { display: none; }
  .chips button { width: auto; padding: 8px 13px; font-size: 14px; border-radius: 999px; font-weight: 600; background: transparent; color: var(--fg); border-color: var(--line); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 104px; justify-content: space-between; }
  .field label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .field input { font-family: var(--disp); font-size: 30px; font-weight: 800; background: transparent; border: 0; color: var(--fg); width: 100%; padding: 0; outline: none; font-variant-numeric: tabular-nums; }
  .field input::placeholder { color: #3c4753; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button { width: 42px; height: 42px; padding: 0; font-size: 22px; border-radius: 12px; background: var(--bg2); font-weight: 500; }
  .stepper input { text-align: center; }
  .spacer { flex: 1; }
  /* live: camera, then the ring */
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #cam.mirror, #ov.mirror { transform: scaleX(-1); }
  #ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #live { padding: 0; gap: 0; background: #000; }
  .liveTop { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 24px; display: flex; align-items: center; gap: 10px; background: linear-gradient(rgba(15,19,24,.9), rgba(15,19,24,0)); z-index: 3; }
  .liveTop .back { background: rgba(27,34,43,.7); backdrop-filter: blur(8px); }
  .liveTop .name { font-family: var(--disp); font-size: 20px; font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .liveTop .setNo { font-family: var(--disp); font-size: 15px; font-weight: 800; color: var(--accent); background: rgba(255,176,32,.12); border: 1px solid rgba(255,176,32,.35); padding: 6px 12px; border-radius: 999px; }
  #big { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-56%); display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 2; }
  #ring { width: min(74vw, 330px); height: min(74vw, 330px); position: relative; display: grid; place-items: center; }
  #ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  #ring circle { fill: none; stroke-width: 6; }
  #ring .track { stroke: rgba(238,241,245,.14); }
  #ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s ease-out, stroke .3s; filter: drop-shadow(0 0 10px rgba(255,176,32,.55)); }
  #ring.rest .bar { stroke: var(--rest); filter: drop-shadow(0 0 10px rgba(63,210,199,.5)); }
  #big .n { font-family: var(--disp); font-size: clamp(120px, 42vw, 180px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.05em; text-shadow: 0 6px 30px rgba(0,0,0,.85); }
  #big .n.rest { color: var(--rest); font-size: clamp(100px, 34vw, 150px); }
  #big .t { font-size: 20px; font-weight: 700; margin-top: 14px; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
  #big .goal { font-size: 16px; color: #c3cad3; margin-top: 4px; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
  #status { position: absolute; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); text-align: center; font-size: 16px; font-weight: 600; color: var(--fg); z-index: 3; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
  #status.warn { color: var(--accent); }
  .liveBottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; gap: 10px; background: linear-gradient(rgba(15,19,24,0), rgba(15,19,24,.92)); z-index: 3; }
  .liveBottom button { font-size: 16px; padding: 15px 10px; background: rgba(27,34,43,.75); backdrop-filter: blur(10px); border-color: rgba(255,255,255,.08); }
  .liveBottom button.danger { color: var(--bad); }
  #frame { position: absolute; inset: 0; border: 4px solid transparent; pointer-events: none; z-index: 1; transition: border-color .3s; }
  #frame.ok { border-color: rgba(110,231,160,.55); } #frame.bad { border-color: rgba(255,107,107,.55); }
  /* summary + history */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px 10px 14px; text-align: center; }
  .tile .k { font-size: 13px; color: var(--muted); font-weight: 600; }
  .tile .v { font-family: var(--disp); font-size: 34px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .tile .v small { font-size: 15px; color: var(--muted); font-weight: 500; }
  .setRow { display: grid; grid-template-columns: 64px 1fr auto; align-items: baseline; gap: 10px; padding: 14px 4px; border-bottom: 1px solid var(--line); font-size: 16px; color: var(--muted); }
  .setRow b { font-family: var(--disp); font-size: 26px; font-weight: 800; color: var(--fg); font-variant-numeric: tabular-nums; } .setRow .m { font-size: 14px; }
  .setRow.short b { color: var(--accent); }
  .ses { padding: 14px 4px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
  .ses .h { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--disp); font-weight: 800; font-size: 19px; }
  .ses .h span:last-child { font-family: var(--body); font-weight: 500; font-size: 14px; color: var(--muted); }
  .ses .d { color: var(--muted); font-size: 15px; }
  .day { color: var(--accent); font-size: 13px; font-weight: 700; margin-top: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; line-height: 1.6; }
  .seg { display: flex; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  .seg button { border: 0; border-radius: 0; padding: 11px; font-size: 14px; background: var(--bg2); font-weight: 600; }
  .seg button.on { background: var(--fg); color: var(--bg); }
  .srow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
  .srow .seg { width: 190px; }
  @media (prefers-reduced-motion: reduce) { #ring .bar { transition: none; } }
</style>
</head>
<body>

<!-- 1. setup -->
<div id="setup" class="screen">
  <h1>카운팅 <small>COUNTING</small></h1>
  <p class="sub">목표만 정하고 시작하세요. 동작은 카메라가 알아서 인식해 셉니다.</p>
  <div class="exField"><label>오늘 운동</label><input id="ex" type="text" placeholder="덤벨 컬" maxlength="24"><div class="chips" id="exRecent"></div></div>
  <div class="grid2">
    <div class="field" id="wtField"><label>무게 (kg, 선택)</label><input id="wt" type="number" inputmode="decimal" step="0.5" min="0" placeholder="0"></div>
    <div class="field"><label>쉬는 시간 (초)</label><div class="stepper"><button data-k="rest" data-d="-15">−</button><input id="rest" type="number" inputmode="numeric" min="0" step="15" value="90"><button data-k="rest" data-d="15">+</button></div></div>
    <div class="field"><label>목표 횟수</label><div class="stepper"><button data-k="reps" data-d="-1">−</button><input id="reps" type="number" inputmode="numeric" min="1" value="10"><button data-k="reps" data-d="1">+</button></div></div>
    <div class="field"><label>목표 세트</label><div class="stepper"><button data-k="sets" data-d="-1">−</button><input id="sets" type="number" inputmode="numeric" min="1" value="3"><button data-k="sets" data-d="1">+</button></div></div>
  </div>
  <div class="spacer"></div>
  <button class="primary" id="startBtn">운동 시작</button>
  <div class="row"><button id="histBtn">기록</button><button id="setBtn">설정</button></div>
  <p class="sub" id="err" style="color:var(--bad)"></p>
</div>

<!-- 2. live -->
<div id="live" class="screen" hidden>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="ov"></canvas>
  <div id="frame"></div>
  <div class="liveTop"><button class="back" id="liveBack">←</button><span class="name" id="liveName"></span><span class="setNo" id="liveSet">1 / 3 세트</span></div>
  <div id="big"><div id="ring"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46"/><circle class="bar" id="ringBar" cx="50" cy="50" r="46" stroke-dasharray="289" stroke-dashoffset="289"/></svg><div class="n" id="bigN">0</div></div><div class="t" id="bigT"></div><div class="goal" id="bigG"></div></div>
  <div id="status">카메라 준비 중…</div>
  <div class="liveBottom"><button id="endSetBtn">세트 끝내기</button><button id="skipRestBtn" hidden>휴식 건너뛰기</button><button class="danger" id="endBtn">운동 종료</button></div>
</div>

<!-- 3. summary -->
<div id="summary" class="screen" hidden>
  <div class="hh"><button class="back" id="sumBack">←</button><h1 id="sumTitle">운동 끝</h1></div>
  <div class="tiles" id="sumTiles"></div>
  <div id="sumSets" style="display:flex;flex-direction:column;gap:8px"></div>
  <div class="spacer"></div>
  <button class="primary" id="againBtn">같은 설정으로 한 번 더</button>
  <button id="homeBtn">처음으로</button>
</div>

<!-- 4. history -->
<div id="hist" class="screen" hidden>
  <div class="hh"><button class="back" id="histBack">←</button><h1>기록</h1></div>
  <div id="histList" style="display:flex;flex-direction:column;gap:8px"></div>
</div>

<!-- 5. settings -->
<div id="settings" class="screen" hidden>
  <div class="hh"><button class="back" id="setBack">←</button><h1>설정</h1></div>
  <div class="srow"><span>카메라</span><div class="seg" id="segFacing"><button data-v="environment">후면</button><button data-v="user">전면</button></div></div>
  <div class="srow"><span>음성 카운트</span><div class="seg" id="segVoice"><button data-v="1">켜짐</button><button data-v="0">꺼짐</button></div></div>
  <div class="srow"><span>관절 모델</span><div class="seg" id="segModel"><button data-v="full">정밀</button><button data-v="lite">빠름</button></div></div>
  <div class="srow"><span>화면 맞춤</span><div class="seg" id="segFit"><button data-v="contain">전체 보기</button><button data-v="cover">꽉 채움</button></div></div>
  <p class="sub">카메라 영상과 기록은 이 폰 안에서만 처리·저장됩니다. <a href="../privacy.html" style="color:var(--accent)">개인정보 처리방침</a></p>
  <div class="spacer"></div>
  <button class="danger" id="wipeBtn">모든 기록 지우기</button>
  <p class="sub" id="ver"></p>
</div>

<script type="module">
const APP_VERSION = "counting-2026-10-27a";
const $ = id => document.getElementById(id);
const LS = k => { try { return localStorage.getItem("ct_" + k); } catch { return null; } };
const SS = (k, v) => { try { localStorage.setItem("ct_" + k, v); } catch {} };
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

// ---------- settings ----------
let facing = LS("facing") || "environment", voiceOn = LS("voice") !== "0", modelTier = LS("model") === "lite" ? "lite" : "full", fitMode = LS("fit") === "cover" ? "cover" : "contain";
function renderSettings() {
  const on = (id, v) => $(id).querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  on("segFacing", facing); on("segVoice", voiceOn ? "1" : "0"); on("segModel", modelTier); on("segFit", fitMode);
  $("ver").textContent = "앱 버전 " + APP_VERSION;
  $("cam").style.objectFit = fitMode;
}
$("segFacing").onclick = e => { if (e.target.dataset.v) { facing = e.target.dataset.v; SS("facing", facing); renderSettings(); } };
$("segVoice").onclick = e => { if (e.target.dataset.v) { voiceOn = e.target.dataset.v === "1"; SS("voice", voiceOn ? "1" : "0"); renderSettings(); } };
$("segModel").onclick = e => { if (e.target.dataset.v) { modelTier = e.target.dataset.v; SS("model", modelTier); renderSettings(); } };
$("segFit").onclick = e => { if (e.target.dataset.v) { fitMode = e.target.dataset.v; SS("fit", fitMode); renderSettings(); } };
$("wipeBtn").onclick = () => { if (confirm("모든 기록을 지울까요?")) { try { localStorage.removeItem("ct_sessions"); } catch {} renderHistory(); alert("지웠습니다."); } };

// ---------- screens (phone back button closes the top screen) ----------
const SCREENS = ["setup", "live", "summary", "hist", "settings"];
function show(id) { for (const s of SCREENS) $(s).hidden = s !== id; if (id !== "setup") { try { history.pushState({ s: id }, ""); } catch {} } }
window.addEventListener("popstate", () => { if (!$("live").hidden) { endWorkout(true); return; } if (!$("summary").hidden) { show("setup"); return; } show("setup"); });
$("histBtn").onclick = () => { renderHistory(); show("hist"); };
$("setBtn").onclick = () => { renderSettings(); show("settings"); };
$("histBack").onclick = $("setBack").onclick = $("sumBack").onclick = $("homeBtn").onclick = () => history.back();

// ---------- setup form ----------
const num = (id, d) => { const v = parseFloat($(id).value); return Number.isFinite(v) ? v : d; };
document.querySelectorAll(".stepper button").forEach(b => b.onclick = () => { const el = $(b.dataset.k), min = +el.min || 0; el.value = Math.max(min, num(b.dataset.k, min) + (+b.dataset.d)); saveForm(); });
function saveForm() { SS("form", JSON.stringify({ ex: $("ex").value, wt: $("wt").value, rest: $("rest").value, reps: $("reps").value, sets: $("sets").value })); }
["ex", "wt", "rest", "reps", "sets"].forEach(id => $(id).oninput = saveForm);
$("ex").oninput = () => { saveForm(); renderRecent(); };
function renderRecent() {   // recently used exercise names, one tap to fill in
  const rec = JSON.parse(LS("recentEx") || "[]"), cur = $("ex").value.trim(); const el = $("exRecent"); el.innerHTML = "";
  rec.filter(n => n !== cur).slice(0, 8).forEach(n => { const b = document.createElement("button"); b.className = "recent"; b.textContent = n; b.onclick = () => { $("ex").value = n; saveForm(); renderRecent(); }; el.appendChild(b); });
}
function rememberEx(n) { if (!n || n === "운동") return; const rec = JSON.parse(LS("recentEx") || "[]"); const i = rec.indexOf(n); if (i >= 0) rec.splice(i, 1); rec.unshift(n); SS("recentEx", JSON.stringify(rec.slice(0, 12))); }
try { const f = JSON.parse(LS("form") || "null"); if (f) { $("ex").value = typeof f.ex === "string" ? f.ex : (Array.isArray(f.ex) ? f.ex[0] || "" : ""); $("wt").value = f.wt || ""; $("rest").value = f.rest || 90; $("reps").value = f.reps || 10; $("sets").value = f.sets || 3; } } catch {}
renderRecent();

// ---------- audio ----------
let audioCtx = null, lastSpokeAt = 0;
function beep(freq, ms, count = 1) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    for (let k = 0; k < count; k++) { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + k * (ms / 1000 + 0.08); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + ms / 1000); o.start(t); o.stop(t + ms / 1000); }
  } catch {}
}
function say(text) { if (!voiceOn || !("speechSynthesis" in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "ko-KR"; u.rate = 1.05; speechSynthesis.speak(u); lastSpokeAt = Date.now(); } catch {} }

// ---------- pose model ----------
const VISION_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODELS = { lite: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                 full: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task" };
let visionMod = null, landmarker = null, landmarkerImg = null, loadedTier = "";
async function loadPose() {
  if (landmarker && loadedTier === modelTier) return;
  if (!visionMod) visionMod = await import(VISION_URL);
  const { PoseLandmarker, FilesetResolver } = visionMod;
  const vision_ = await FilesetResolver.forVisionTasks(VISION_URL + "/wasm");
  const opts = (d, mode, n) => ({ baseOptions: { modelAssetPath: MODELS[modelTier], delegate: d }, runningMode: mode, numPoses: n });
  const old = landmarker, oldImg = landmarkerImg; landmarker = null; landmarkerImg = null; let del = "GPU";
  try { landmarker = await PoseLandmarker.createFromOptions(vision_, opts("GPU", "VIDEO", 2)); } catch { landmarker = await PoseLandmarker.createFromOptions(vision_, opts("CPU", "VIDEO", 2)); del = "CPU"; }
  try { landmarkerImg = await PoseLandmarker.createFromOptions(vision_, opts(del, "IMAGE", 3)); } catch { landmarkerImg = null; }
  loadedTier = modelTier; sm = null; personLock = null;
  try { if (old) old.close(); if (oldImg) oldImg.close(); } catch {}
}

// ---------- camera ----------
const video = $("cam"), ov = $("ov"), ctx = ov.getContext("2d");
let stream = null;
async function startCamera() {
  const base = { width: { ideal: 960 }, height: { ideal: 1280 }, frameRate: { ideal: 30 } };
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, ...base }, audio: false }); }
  catch (e) { if (e.name === "OverconstrainedError" || e.name === "NotFoundError") stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); else throw e; }
  video.srcObject = stream; await new Promise(r => video.onloadedmetadata = r); await video.play();

const repsText = x => Array.isArray(x.reps) ? x.reps.join(" + ") : String(x.reps);   // older records kept per-movement arrays

$("againBtn").onclick = () => { show("setup"); setTimeout(() => $("startBtn").click(), 50); };

// ---------- overlay: whole body, whatever is in frame (cut-off parts are simply not drawn), recognised chain on top ----------
const BODY = [[11,12],[11,13],[13,15],[12,14],[14,16],[15,19],[16,20],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,31],[28,32]];
const BODY_JOINTS = [11,12,13,14,15,16,23,24,25,26,27,28];
function draw() {
  if (ov.width !== ov.clientWidth || ov.height !== ov.clientHeight) { ov.width = ov.clientWidth; ov.height = ov.clientHeight; }

  const L = W && W.lastPose; if (!L) return;
  const vw = video.videoWidth, vh = video.videoHeight, cw = ov.width, ch = ov.height;
  const s = fitMode === "cover" ? Math.max(cw / vw, ch / vh) : Math.min(cw / vw, ch / vh), ox = (cw - vw * s) / 2, oy = (ch - vh * s) / 2;
  const P = i => { const q = L[i]; return [ox + (q.x + (q.vx || 0) * 0.09) * vw * s, oy + (q.y + (q.vy || 0) * 0.09) * vh * s]; };

  if (!ids) return;
  ctx.strokeStyle = "#c5f03e"; ctx.lineWidth = 7; ctx.beginPath(); ids.forEach((i, k) => { const p = P(i); k ? ctx.lineTo(...p) : ctx.moveTo(...p); }); ctx.stroke();
  ids.forEach((i, k) => { const p = P(i); ctx.fillStyle = k === 1 ? "#ffffff" : "#c5f03e"; ctx.beginPath(); ctx.arc(p[0], p[1], k === 1 ? 13 : 10, 0, 7); ctx.fill(); });
}
