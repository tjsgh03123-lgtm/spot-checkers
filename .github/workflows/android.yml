# Builds the Android app (Trusted Web Activity wrapper around the PWA) with Bubblewrap on GitHub's runners.
# Run it from the Actions tab ("Run workflow"). Outputs: APK (install directly), AAB (Play Store), and assetlinks.json.
# First run creates a signing keystore and prints its SHA-256; save the keystore artifact and add it as the
# ANDROID_KEYSTORE_B64 secret so every later build is signed with the same key (otherwise updates won't install).
name: android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [twa-manifest.json, twa-manifest-counting.json]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { edition: onemore,  manifest: twa-manifest.json,          pkg: app.onemore.counter,  release: android-latest,          dir: twa-onemore }
          - { edition: counting, manifest: twa-manifest-counting.json, pkg: app.onemore.counting, release: android-counting-latest, dir: twa-counting }
      max-parallel: 1
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'onemore-keystore' }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'onemore-keystore' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Bubblewrap CLI
        run: npm i -g @bubblewrap/cli
      - name: Bubblewrap config (use the runner's JDK + Android SDK)
        run: |
          # Bubblewrap expects the legacy layout <sdk>/tools/bin/sdkmanager; mirror the runner's SDK with that extra link
          SDK=$HOME/android-sdk; mkdir -p $SDK; for d in $ANDROID_HOME/*; do ln -sfn "$d" "$SDK/$(basename $d)"; done
          ln -sfn $ANDROID_HOME/cmdline-tools/latest $SDK/tools
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$SDK\"}" > ~/.bubblewrap/config.json
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV; echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          ls $SDK; ls $SDK/tools/bin | head
      - name: Keystore (restore from secret, or create once)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android.keystore
            echo "keystore restored from secret"
          elif [ -f android.keystore ]; then
            echo "keystore from the repository"
          else
            keytool -genkeypair -v -keystore android.keystore -alias onemore -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -keypass "$BUBBLEWRAP_KEY_PASSWORD" \
              -dname "CN=One More, OU=App, O=OneMore, L=Seoul, C=KR"
            echo "::warning::New keystore created. Download the 'keystore' artifact and add it as the ANDROID_KEYSTORE_B64 secret (base64) so future builds use the same key."
          fi
      - name: Generate the Android project from the edition's manifest (in its own folder)
        run: |
          mkdir -p ${{ matrix.dir }} && cp ${{ matrix.manifest }} ${{ matrix.dir }}/twa-manifest.json && cp android.keystore ${{ matrix.dir }}/
          cd ${{ matrix.dir }} && bubblewrap update --manifest ./twa-manifest.json --skipVersionUpgrade
      - name: Build APK + AAB
        run: |
          set -o pipefail
          cd ${{ matrix.dir }} && bubblewrap build --skipPwaValidation --manifest ./twa-manifest.json 2>&1 | tee ../build.log
          cp app-release-signed.apk app-release-bundle.aab ..
      - name: List outputs
        if: always()
        run: ls -la >> build.log; ls -la *.apk *.aab >> build.log 2>&1 || true
      - name: Push build log to the ci-logs branch (readable without the Actions UI)
        if: always()
        run: |
          mkdir -p /tmp/cilog && cp build.log /tmp/cilog/ && cd /tmp/cilog
          git init -q && git config user.name ci && git config user.email ci@ci && git add . && git commit -qm "build log $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:ci-logs
      - name: SHA-256 fingerprint → assetlinks.json
        run: |
          FP=$(keytool -list -v -keystore android.keystore -alias onemore -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep 'SHA256:' | sed 's/.*SHA256: //')
          echo "SHA256=$FP" >> $GITHUB_ENV
          mkdir -p .well-known
          # both editions are signed with the same key: one assetlinks.json lists both packages
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"app.onemore.counter","sha256_cert_fingerprints":["%s"]}},{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"app.onemore.counting","sha256_cert_fingerprints":["%s"]}}]\n' "$FP" "$FP" > .well-known/assetlinks.json
          cat .well-known/assetlinks.json
      - name: Publish assetlinks.json to the site (main + gh-pages)
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git pull -q --rebase origin main || true
          git add .well-known/assetlinks.json
          git commit -m "assetlinks.json for app.onemore.counter + app.onemore.counting ($SHA256)" || echo "no change"
          git push origin HEAD:main || true
          git push -f origin HEAD:gh-pages || true
      - name: Publish APK + AAB as the "android-latest" release (plain download link for the phone)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cp app-release-signed.apk ${{ matrix.edition }}.apk; cp app-release-bundle.aab ${{ matrix.edition }}.aab
          gh release delete ${{ matrix.release }} -y --cleanup-tag 2>/dev/null || true
          gh release create ${{ matrix.release }} ${{ matrix.edition }}.apk ${{ matrix.edition }}.aab --title "${{ matrix.edition == 'counting' && '카운팅' || '원 모어' }} Android (최신 빌드)" \
            --notes "앱 버전 $(node -p "require('./${{ matrix.manifest }}').appVersionName") · 패키지 ${{ matrix.pkg }} · 서명 SHA-256 $SHA256 · 빌드 $GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.edition }}-apk", path: app-release-signed.apk }
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.edition }}-aab", path: app-release-bundle.aab }
